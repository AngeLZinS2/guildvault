<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Personagens GuildVault</title></head><body style="margin:0;background:#18212b"><div style="position:absolute;top:20px;left:20px;color:white;font:16px Arial">Prévia dos personagens CC0 <button onclick="setClip('Idle')">Parado</button><button onclick="setClip('Walk')">Andar</button><button onclick="setClip('Run')">Correr</button><button onclick="camera.position.set(0,1.65,2.3);camera.lookAt(0,1.5,0)">Rosto</button></div><script src="libs/three.min.js"></script><script src="libs/three-examples/GLTFLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color('#18212b');const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(0,1.3,4.8);camera.lookAt(0,1.05,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x646c78,1.1));const light=new THREE.DirectionalLight(0xffeee3,1.5);light.position.set(-3,4,5);scene.add(light);const mixers=[];const characters=[];function setClip(name){characters.forEach(c=>{c.m.stopAllAction();c.m.clipAction(c.g.animations.find(a=>a.name===name)).play()})}for(const [name,x] of [['man',-.65],['woman',.65]])new THREE.GLTFLoader().load('/models/city/human-aa-'+name+'.glb',g=>{g.scene.position.x=x;g.scene.rotation.y=0;scene.add(g.scene);const m=new THREE.AnimationMixer(g.scene);m.clipAction(g.animations.find(a=>a.name==='Idle')).play();mixers.push(m);characters.push({m,g})});const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();mixers.forEach(m=>m.update(dt));renderer.render(scene,camera)}animate();</script></body></html>
