<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>GuildVault — áudio</title><style>body{background:#101c24;color:#e8f5ec;font:18px system-ui;padding:40px}button{padding:14px;margin:5px;background:#bfdac7;color:#142820;border:0;border-radius:6px}#state{margin:20px 0;white-space:pre-line}</style></head><body><h1>Teste de áudio GuildVault</h1><p>Gravação Audi V8, motor, rodagem, pneus e efeitos.</p><button id="play">Ativar motor</button><button id="start">Ligar carro</button><button id="rev">Acelerar</button><button id="exit">Sair do carro</button><button id="near">Sirene perto</button><button id="far">Sirene longe</button><button id="off">Encerrar perseguição</button><button id="horn">Buzina</button><button id="crash">Batida</button><button id="mute">Silenciar</button><p><label>Volume <input id="volume" type="range" min="0" max="100" value="55"></label></p><div id="state">Aguardando clique para liberar o áudio.</div><script src="src/data/kakkanad-geo.js"></script><script src="src/config.js"></script><script src="src/audio.js"></script><script>
const a=window.soundEngine;const police=[{isActive:false,position:{x:15,z:0}}];let analyser,ratio=0;const p={state:'IN_VEHICLE',velocity:{x:0,z:0},currentVehicle:{dynamics:{vl:0}},isGrounded:true,keys:{up:false}};document.getElementById('play').onclick=async()=>{a.init();a.setMuted(false);await a.resume();a.updateEngine(0);if(!analyser){analyser=a.ctx.createAnalyser();analyser.fftSize=1024;const silence=a.ctx.createGain();silence.gain.value=0;a.masterGain.connect(analyser);analyser.connect(silence);silence.connect(a.ctx.destination)}};document.getElementById('start').onclick=async()=>{await a.resume();a.setMuted(false);p.state='IN_VEHICLE';p.keys.up=false;p.velocity.x=0;ratio=0;a.playEngineStart()};document.getElementById('exit').onclick=()=>{p.state='ON_FOOT';p.keys.up=false;p.velocity.x=0;ratio=0;a.stopEngineStart();a.stopAcceleration()};document.getElementById('rev').onclick=()=>{p.keys.up=true;ratio=.8;p.velocity.x=25;p.currentVehicle.dynamics.vl=2};document.getElementById('near').onclick=()=>{police[0].isActive=true;police[0].position.x=15};document.getElementById('far').onclick=()=>{police[0].position.x=100};document.getElementById('off').onclick=()=>{police[0].isActive=false};document.getElementById('horn').onclick=()=>a.playHorn();document.getElementById('crash').onclick=()=>a.playCrash(.5);document.getElementById('mute').onclick=()=>a.toggleMute();document.getElementById('volume').oninput=e=>a.setVolume(Number(e.target.value)/100);setInterval(()=>{if(!analyser)return;a.updateEngine(ratio);a.updateWorld(.1,p,police);const data=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(data);const rms=Math.sqrt(data.reduce((sum,x)=>sum+x*x,0)/data.length);document.getElementById('state').textContent='Gravações policiais: '+Object.entries(a.sirenLayers).map(([name,layer])=>name+' '+layer.buffer.duration.toFixed(2)+'s '+(layer.source?'tocando':'pronta')).join(' · ')+'\nSirene: '+(a.sirenLevel>0?'contínua · '+a.sirenDistance.toFixed(0)+'m':'fora de alcance / inativa')+'\nPartida: '+(a.engineStartBuffer?a.engineStartBuffer.duration.toFixed(3)+'s decodificada':'carregando')+'\nIgnição: '+(a.engineStartVoice?'tocando':a.engineStartPending?'aguardando':'parada')+'\nGravação: '+(a.accelerationBuffer ? a.accelerationBuffer.duration.toFixed(3)+'s decodificada' : 'carregando')+'\nReprodução: '+(a.accelerationVoice?'Audi V8 ativo':'motor base')+'\nAudioContext: '+a.ctx.state+'\nVolume: '+Math.round(a.volume*100)+'%\n'+(a.isMuted?'Silenciado':'Som ligado')+'\nRMS do sinal: '+rms.toFixed(5)+'\n'+(a.isMuted?rms<.00001?'PASS — silêncio':'Atenuando…':rms>.00001?'PASS — sinal de áudio presente':'Aguardando sinal…')},100);</script></body></html>
