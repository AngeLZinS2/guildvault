<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GuildVault · Frota policial</title>
<style>body{margin:0;background:#17232d;color:#f4f0df;font:14px system-ui}header{position:absolute;top:22px;left:26px;right:26px;z-index:1;pointer-events:none}h1{font-size:25px;margin:5px 0}small{letter-spacing:3px;color:#8cc9c8}nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px;pointer-events:auto}button,a{background:#203440;color:#f4f0df;border:1px solid #668084;padding:9px 13px;border-radius:5px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{border-color:#dfae72;background:#3a3c35}#status{position:absolute;bottom:24px;left:26px;background:#142630e8;padding:12px 16px;border-radius:6px;max-width:600px;white-space:pre-line;pointer-events:none}</style></head>
<body><header><small>GUILDVAULT / MOTOR POOL</small><h1>Frota policial</h1><nav id="views"><button data-view="-1" aria-pressed="true">Toda a frota</button><button data-view="0">Crown Victoria</button><button data-view="1">Peugeot 5008</button><button data-view="2">Cruiser 8</button><button data-view="3">LSPD</button><button id="lights" aria-pressed="true">Giroflex</button><button id="boxes" aria-pressed="false">Mostrar colisões</button><a href="/">Voltar ao jogo</a><a href="/licenses/guildvault-3d.txt">Créditos</a></nav></header><div id="status">Preparando as viaturas…</div>
<script src="libs/three.min.js"></script><script src="libs/three-examples/GLTFLoader.js"></script><script src="src/vehicle-physics.js"></script><script src="city-assets.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color('#182b36');scene.fog=new THREE.Fog('#182b36',24,70);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(9,7,15);camera.lookAt(0,.4,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdceaff,0x667068,1.3));const sun=new THREE.DirectionalLight(0xffeedb,1.4);sun.position.set(7,15,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15});scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x35414a,roughness:.82}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;floor.receiveShadow=true;scene.add(floor);
const fleet=[],helpers=[];let lights=true,boxes=false,view=-1;const homes=[[-3.1,3.6],[3.1,3.6],[-3.1,-3.6],[3.1,-3.6]];
function select(value){view=value;fleet.forEach((m,i)=>{m.visible=view<0||i===view;m.position.set(view<0?homes[i][0]:0,0,view<0?homes[i][1]:0)});camera.position.set(view<0?9:6.4,view<0?7:3.5,view<0?15:8);camera.lookAt(0,.5,0);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.view)===view));updateHelpers()}
function updateHelpers(){helpers.forEach((h,i)=>{h.visible=boxes&&fleet[i].visible;h.update()})}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>select(Number(b.dataset.view)));document.getElementById('lights').onclick=e=>{lights=!lights;e.target.setAttribute('aria-pressed',lights)};document.getElementById('boxes').onclick=e=>{boxes=!boxes;e.target.setAttribute('aria-pressed',boxes);updateHelpers()};
GuildVaultPoliceAssets.load().then(results=>{
 let passed=true;const lines=[];
 results.forEach((r,i)=>{
  if(r.status!=='fulfilled'){passed=false;lines.push('FALHA: '+GuildVaultPoliceAssets.models[i].name);return}
  const m=GuildVaultPoliceAssets.create(r.value,GuildVaultPoliceAssets.models[i]);scene.add(m);fleet.push(m);m.position.set(homes[i][0],0,homes[i][1]);m.updateMatrixWorld(true);
  const c=m.userData.collision,wheels=m.userData.wheels;const box=new THREE.Box3().setFromObject(m);
  const vehicle={mesh:m,position:m.position,heading:0,archetype:c};const fp=vehicleFootprint(vehicle);
  const near=circleVehicleContact({x:fp.position.x,y:.1,z:fp.position.z+c.length/2+.29},.3,vehicle);
  const clear=circleVehicleContact({x:fp.position.x,y:.1,z:fp.position.z+c.length/2+.31},.3,vehicle);
  const ok=wheels.length===4&&Math.abs(box.min.y)<.02&&c.width>1.5&&c.width<2.6&&c.length>4&&c.length<5.8&&!!near&&!clear;
  passed=passed&&ok;lines.push((ok?'✓':'FALHA')+' '+GuildVaultPoliceAssets.models[i].name+' · '+c.width.toFixed(2)+' × '+c.length.toFixed(2)+' m · '+wheels.length+' rodas'+(ok?'':' · piso '+box.min.y.toFixed(3)+' · contato '+!!near+'/'+!!clear));
  const helper=new THREE.Box3Helper(box,0xf5b772);helper.update=()=>{const f=vehicleFootprint(vehicle);helper.box.set(new THREE.Vector3(f.position.x-c.width/2,m.position.y+.05,f.position.z-c.length/2),new THREE.Vector3(f.position.x+c.width/2,m.position.y+c.height,f.position.z+c.length/2))};scene.add(helper);helpers.push(helper);helper.visible=false;
 });document.getElementById('status').textContent=lines.join('\n')+'\n'+(passed?'PASS — escala, rodas, piso e contato a 1 cm verificados.':'Verificar geometria indicada.');
}).catch(e=>document.getElementById('status').textContent='Falha ao carregar: '+e.message);
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();fleet.forEach(m=>{m.userData.strobeRed.visible=lights&&Math.floor(t*8)%2===0;m.userData.strobeBlue.visible=lights&&Math.floor(t*8)%2===1});renderer.render(scene,camera)}animate();window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
