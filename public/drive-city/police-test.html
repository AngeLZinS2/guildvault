<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>GuildVault · teste de perseguição</title><style>body{margin:0;background:#13222d;color:white;font:14px system-ui}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}aside{position:absolute;z-index:2;top:80px;left:16px;background:#13222dee;padding:12px;border-radius:5px;max-width:390px}button{padding:10px;cursor:pointer}#state{white-space:pre-line}</style></head><body><iframe id="game" src="index.html?quality=medium" title="Teste da cidade e das viaturas"></iframe><aside><button id="chase">Testar perseguição</button><button id="pause">Pausar teste</button><button id="entry">Entrar/sair do carro</button><div id="state">Carregando cidade…</div></aside><script>
const frame=document.getElementById('game'),state=document.getElementById('state');let checks=0;document.getElementById('entry').onclick=async()=>{const g=frame.contentWindow.gameEngine;if(g){await g.soundEngine.resume();g.player.onActionKey()}};
document.getElementById('chase').onclick=async()=>{const g=frame.contentWindow.gameEngine;if(g&&g.policeManager.policeUnits.every(v=>v.mesh.userData.policeModel)){await g.soundEngine.resume();g.policeManager.addCrimeHeat(200);checks++;}};
document.getElementById('pause').onclick=()=>frame.contentWindow.postMessage({channel:'guildvault-city',type:'pause',paused:true},location.origin);
setInterval(()=>{const g=frame.contentWindow.gameEngine;if(!g)return;const units=g.policeManager.policeUnits,loaded=units.filter(v=>v.mesh.userData.policeModel),active=units.filter(v=>v.isActive);state.textContent=loaded.length+' / 4 modelos integrados\n'+loaded.map(v=>v.mesh.userData.policeModel+' · '+v.mesh.userData.wheels.length+' rodas').join('\n')+'\nJogador: '+g.player.state+' · partida: '+(g.soundEngine.engineStartVoice?'tocando':g.soundEngine.engineStartPending?'aguardando':'parada')+'\nSirene: '+(g.soundEngine.sirenLevel>0?'audível · '+g.soundEngine.sirenDistance.toFixed(0)+'m':'inativa / fora de alcance')+' · áudio: '+g.soundEngine.ctx?.state+'\nProcurado: '+g.policeManager.wantedLevel+' · viaturas ativas: '+active.length+'\n'+(checks&&loaded.length===4&&active.length===4?'PASS — frota real ativa na perseguição':loaded.length===4?'Pronto para testar a perseguição':'Carregando viaturas…');},500);
</script></body></html>
