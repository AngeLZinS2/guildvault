<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>GuildVault — teste de colisões</title><style>body{margin:0;background:#17212a;color:#fff;font:14px monospace}#report{position:absolute;top:12px;left:12px;background:#101820d9;padding:12px;white-space:pre-line}canvas{display:block}</style></head><body><div id="report">Carregando modelos para medir as hitboxes…</div><script src="libs/three.min.js"></script><script src="libs/three-examples/GLTFLoader.js"></script><script src="src/vehicle-physics.js"></script><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);scene.background=new THREE.Color('#17212a');camera.position.set(8,9,11);camera.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0x454545,1.5));const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(3,8,5);scene.add(light);const lines=[];Promise.all([['Audi R8','/models/guildvault-audi-r8.glb',-3],['Concept GT','/models/city/concept-traffic.glb',3]].map(([name,url,x])=>new Promise((ok,no)=>new THREE.GLTFLoader().load(url,g=>{const root=new THREE.Group();root.add(g.scene);window.fitVehicleCollision(root);const box=root.userData.collision;root.position.x=x;scene.add(root);const v={position:root.position,heading:0,mesh:root,archetype:{width:2,length:4.5}};const geometry=new THREE.BoxGeometry(box.width,box.height,box.length),wire=new THREE.LineSegments(new THREE.EdgesGeometry(geometry),new THREE.LineBasicMaterial({color:0x66ffbb}));wire.position.set(x+box.x,box.height/2,box.z);scene.add(wire);const point=new THREE.Vector3(x+box.x,0,box.z+box.length/2+.31);const free=!window.circleVehicleContact(point,.3,v);point.z-=.02;const hit=!!window.circleVehicleContact(point,.3,v);lines.push(name+': '+box.width.toFixed(2)+' × '+box.length.toFixed(2)+' m; centro '+box.x.toFixed(2)+', '+box.z.toFixed(2)+'\n'+(free&&hit?'PASS':'FAIL')+' — folga/contato frontal de 1 cm');ok()},undefined,no)))).then(()=>{document.getElementById('report').textContent='Hitboxes medidas dos modelos (verde)\n'+lines.join('\n')}).catch(e=>{document.getElementById('report').textContent='Falha: '+e.message});function draw(){requestAnimationFrame(draw);renderer.render(scene,camera)}draw();</script></body></html>
