server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/(api|health|docs|redoc|openapi.json) {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /media/ { try_files $uri =404; expires 30d; add_header Cache-Control "public"; }
    location /models/ { try_files $uri =404; expires 30d; add_header Cache-Control "public"; }
    location /draco/ { try_files $uri =404; expires 30d; add_header Cache-Control "public"; }
}
